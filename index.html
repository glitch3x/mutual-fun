<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mutual Fun: The Chair Ladder</title>
    <meta name="description" content="A 2048-style puzzle game where you combine chairs to reach the ultimate Throne.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="settings-bar">
            <button id="dark-mode-btn" class="icon-btn" title="Toggle Dark Mode">🌙</button>
            <button id="time-attack-btn" class="icon-btn" title="Toggle Time Attack">⏱️</button>
        </div>
        <header>
            <div class="header-left">
                <h1>The Mutual Fun</h1>
                <p class="subtitle" id="fund-name">FUND: BOGLE</p>
            </div>
            <div class="scores-container">
                <div class="score-box">
                    <div class="score-label">SCORE</div>
                    <div class="score-value" id="score">0</div>
                    <div class="score-addition" id="score-addition"></div>
                </div>
                <div class="score-box">
                    <div class="score-label">BEST</div>
                    <div class="score-value" id="best-score">0</div>
                </div>
                <div class="score-box" id="timer-box" style="display: none; background: #e76f51;">
                    <div class="score-label">TIME</div>
                    <div class="score-value" id="timer">60</div>
                </div>
            </div>
        </header>

        <div class="game-intro">
            <p>Combine matching chairs to reach the <strong>Throne!</strong></p>
            <button id="restart-btn" class="primary-btn">New Game</button>
        </div>

        <div class="grid-container" id="grid-container">
            <!-- Grid background cells -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            
            <!-- Tiles will be injected here via JS -->
            <div id="tile-container"></div>
            
            <div class="game-message" id="game-message">
                <h2 id="message-title">Game Over!</h2>
                <p id="message-desc">You ran out of space.</p>
                <div class="message-actions">
                    <button class="primary-btn" id="retry-btn">Try Again</button>
                    <button class="secondary-btn" id="keep-playing-btn" style="display: none;">Keep Playing</button>
                </div>
            </div>
        </div>
        
        <div class="controls-hint">
            <p>Use <strong>Arrow Keys</strong> or <strong>Swipe</strong> to slide the chairs.</p>
        </div>
        
        <div class="virtual-dpad">
            <div class="dpad-row">
                <button class="dpad-btn" id="btn-up">↑</button>
            </div>
            <div class="dpad-row">
                <button class="dpad-btn" id="btn-left">←</button>
                <button class="dpad-btn" id="btn-down">↓</button>
                <button class="dpad-btn" id="btn-right">→</button>
            </div>
        </div>
        
        <div class="legend">
            <h3>The Ladder</h3>
            <div class="legend-grid" id="legend-grid">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
